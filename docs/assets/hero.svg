<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Dereel: your apps, without the short-video feed</title>
  <desc id="hero-desc">A phone outline in which a fast-scrolling column of short videos collapses into one calm, flat line, which is the Dereel mark.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    /* Without animation the picture rests on the calm line, so reduced-motion readers see the mark. */
    .feed { opacity: 0; animation: feed 10s ease-in-out infinite; }
    .scroll { animation: scroll 1.3s linear infinite; }
    .calm { animation: calm 10s ease-in-out infinite; }
    .glow { opacity: .6; animation: glow 10s ease-in-out infinite; }
    @keyframes feed {
      0%, 34% { opacity: 1; transform: scaleY(1); }
      44% { opacity: 1; transform: scaleY(.04); }
      47%, 91% { opacity: 0; transform: scaleY(.04); }
      92% { opacity: 0; transform: scaleY(1); }
      100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes scroll { to { transform: translateY(-416px); } }
    @keyframes calm {
      0%, 43% { opacity: 0; transform: scaleX(1.9); }
      47% { opacity: 1; transform: scaleX(1.9); }
      54%, 90% { opacity: 1; transform: scaleX(1); }
      96%, 100% { opacity: 0; transform: scaleX(1); }
    }
    @keyframes glow {
      0%, 40% { opacity: .15; }
      55%, 88% { opacity: .6; }
      100% { opacity: .15; }
    }
    @media (prefers-reduced-motion: reduce) {
      .feed, .scroll, .calm, .glow { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1513"/>
      <stop offset="1" stop-color="#12302B"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#1C6A61" stop-opacity=".9"/>
      <stop offset="1" stop-color="#1C6A61" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen">
      <rect x="878" y="46" width="176" height="308" rx="24"/>
    </clipPath>
    <g id="c">
      <rect width="152" height="92" rx="14" fill="currentColor"/>
      <path d="M67 35 L89 46 L67 57 Z" fill="#FFFFFF" fill-opacity=".8"/>
      <rect x="12" y="72" width="60" height="6" rx="3" fill="#FFFFFF" fill-opacity=".35"/>
    </g>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <circle class="glow" cx="966" cy="200" r="228" fill="url(#halo)"/>

  <!-- Mark and name -->
  <rect x="72" y="60" width="64" height="64" rx="18" fill="#1C6A61"/>
  <g transform="translate(50 38)" fill="none" stroke="#FFFFFF" stroke-width="5">
    <path d="M45,31 H63 A7,7 0 0 1 70,38 V70 A7,7 0 0 1 63,77 H45 A7,7 0 0 1 38,70 V38 A7,7 0 0 1 45,31 Z"/>
    <path d="M47,54 H61" stroke-linecap="round"/>
  </g>
  <text x="154" y="111" font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="-.5">Dereel</text>

  <text x="72" y="198" font-size="42" font-weight="700" fill="#FFFFFF">Your apps,</text>
  <text x="72" y="248" font-size="42" font-weight="700" fill="#98D3C7">without the short-video feed.</text>
  <text x="72" y="302" font-size="22" fill="#DEE4E1">Blocks Reels, Shorts and Spotlight in the apps you already use.</text>
  <text x="72" y="342" font-size="17" fill="#BEC9C5">Android · No account · No analytics · Settings and history stay on your phone</text>

  <!-- Phone: the feed scrolls, then settles into the calm line of the mark -->
  <rect x="868" y="36" width="196" height="328" rx="34" fill="#0B100F" stroke="#B4EDE2" stroke-width="6"/>
  <g clip-path="url(#screen)">
    <g transform="translate(966 200)">
      <g class="feed">
        <g transform="translate(-966 -200)">
          <g class="scroll">
            <use href="#c" x="890" y="56" color="#5B2A55"/>
            <use href="#c" x="890" y="160" color="#6B3A0E"/>
            <use href="#c" x="890" y="264" color="#1F3F73"/>
            <use href="#c" x="890" y="368" color="#5A5200"/>
            <use href="#c" x="890" y="472" color="#5B2A55"/>
            <use href="#c" x="890" y="576" color="#6B3A0E"/>
            <use href="#c" x="890" y="680" color="#1F3F73"/>
            <use href="#c" x="890" y="784" color="#5A5200"/>
          </g>
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(966 200)">
    <path class="calm" d="M-40 0 H40" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
